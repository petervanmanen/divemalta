# Builds the Dive Malta iOS app (ios/) and uploads it to App Store Connect, from where it goes to TestFlight.
# The app bundles shared/data/, which is in the repo, so no data steps are needed.
#
# Runs when you push a tag like v1.0.1 (the app gets version 1.0.1), or by hand (Actions › TestFlight ›
# Run workflow; then the version in the Xcode project is used).
# Needs three repository secrets from an App Store Connect API key (see ios/README.md › TestFlight from GitHub):
#   ASC_KEY_ID       Key ID
#   ASC_ISSUER_ID    Issuer ID
#   ASC_PRIVATE_KEY  the full contents of the AuthKey_<KeyID>.p8 file
# Signing is automatic: Xcode uses the API key to fetch or create the certificate and profile,
# so no certificates are stored in GitHub.
name: TestFlight

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

defaults:
  run:
    working-directory: ios

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    # The Xcode 27 image has 27.0 (default), 27.1 RC and 27.2 beta. The app needs the iOS 27.1 SDK to use
    # the whole inner display of the iPhone Duo; built with 27.0 it runs in a smaller window there.
    # Xcode_27.1.app is the image's link to the 27.1 RC (and to 27.1 itself once that replaces it).
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Use Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app

      - name: Write the App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          if [ -z "$ASC_PRIVATE_KEY" ]; then
            echo "::error::Secret ASC_PRIVATE_KEY is not set (see ios/README.md › TestFlight from GitHub)"; exit 1
          fi
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos27.1 || { echo "::error::iOS 27.1 SDK missing"; exit 1; }
          # The version comes from the tag (v1.0.1 -> 1.0.1), like on Android; runs started by hand keep
          # the version in the project. App Store Connect picks the build number (ExportOptions.plist).
          VERSION_ARGS=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "Version $VERSION"
            VERSION_ARGS=(MARKETING_VERSION="$VERSION")
          fi
          xcodebuild archive "${VERSION_ARGS[@]}" \
            -project DiveMalta.xcodeproj -scheme DiveMalta -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DiveMalta.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DiveMalta.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

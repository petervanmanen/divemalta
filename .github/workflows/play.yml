# Builds the Dive Malta Android app (android/) as a signed app bundle and uploads it to Google Play.
#
# Runs when you push a tag like v1.0.1 (same tags as the TestFlight workflow, so one tag releases
# both apps), or by hand (Actions › Google Play › Run workflow) with a choice of track.
# The very first release must be uploaded by hand in Play Console; after that this workflow works.
#
# Repository secrets (see android/README.md › Google Play from GitHub):
#   ANDROID_KEYSTORE_BASE64     the upload keystore (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD   its store password
#   ANDROID_KEY_ALIAS           the key alias (e.g. upload)
#   ANDROID_KEY_PASSWORD        the key password
#   PLAY_SERVICE_ACCOUNT_JSON   JSON key of a Google Cloud service account with release rights in Play Console
name: Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: Release status (use draft to review the release in Play Console first)
        type: choice
        options: [completed, draft]
        default: completed
  push:
    tags: ["v*"]

concurrency:
  group: google-play
  cancel-in-progress: false

defaults:
  run:
    working-directory: android

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Write the signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set (see android/README.md › Google Play from GitHub)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build the app bundle
        run: |
          # Play needs a higher versionCode for every upload; the run number of this workflow always
          # goes up. versionName comes from the tag (v1.0.1 -> 1.0.1).
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || VERSION_NAME="1.0"
          echo "versionCode $VERSION_CODE, versionName $VERSION_NAME"
          ./gradlew bundleRelease -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: nl.petervanmanen.divemalta
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          track: ${{ inputs.track || 'internal' }}
          status: ${{ inputs.status || 'completed' }}

      - name: Remove the signing files
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/upload.jks"
